name: Release

# Tag a commit (e.g. v1.2.3) to build self-contained publishes for Windows, Linux and macOS and
# attach them to a GitHub Release. Every RID embeds the Zstandard translation corpus inside the
# executable (external_translations: "false"); the external layout remains a diagnostic publish
# option that only the CI Windows smoke exercises. Windows publishes natively on a Windows runner,
# then Windows signing runs non-interactively on Ubuntu. Linux publishes on Ubuntu, and the macOS
# RID (Apple Silicon only) publishes on macOS so the .app can be ad-hoc codesigned.
#
# The same tag also builds the Dalamud plugin and attaches its ZIP to the same release. Once every
# asset is attached, the custom Dalamud repository (dalamud/pluginmaster.json on the default
# branch) is pointed at that plugin ZIP.
on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: write

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate tag and derive version
        id: version
        run: ./.github/scripts/release/validate-tag.sh

  publish:
    needs: validate-tag
    # Each RID publishes on its native operating system. The macOS bundle remains ad-hoc signed
    # (mandatory for arm64 to run at all, and removes the "damaged" Gatekeeper error).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # nexus_file_id: "API Info" del fichero en la pestaña Files de nexusmods.com (mod 2513).
          # Windows no lleva nexus_file_id: se distribuye solo por GitHub Releases. El análisis de
          # virus de Nexus marca el ejecutable como poco fiable una y otra vez por ser un .exe.
          - { rid: win-x64,   os: windows-latest, external_translations: "false" }
          - { rid: linux-x64, os: ubuntu-latest, nexus_file_id: 7651772, external_translations: "false" }
          # macos-latest pinned to macos-15: the "latest" label migrates to macOS 26 (beta) from
          # 2026-06-15, before it is a stable target for the ad-hoc codesign/publish steps below.
          - { rid: osx-arm64, os: macos-15,  nexus_file_id: 7608017, external_translations: "false" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Publish ${{ matrix.rid }}
        shell: bash
        run: >-
          ./.github/scripts/release/publish-native.sh
          "${{ matrix.rid }}"
          "${{ matrix.external_translations }}"
          "${{ needs.validate-tag.outputs.version }}"
          "${{ needs.validate-tag.outputs.tag }}"
          "${{ github.repository }}"

      # Keep the Windows publish native, then pass it to a Linux job for non-interactive signing.
      - name: Upload unsigned Windows publish
        if: matrix.rid == 'win-x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-windows-publish
          path: publish/win-x64/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Package Linux or macOS
        if: matrix.rid != 'win-x64'
        run: >-
          ./.github/scripts/release/package-unix.sh
          "${{ needs.validate-tag.outputs.version }}"
          "${{ matrix.rid }}"

      - name: Attach to release
        if: matrix.rid != 'win-x64'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: ${{ needs.validate-tag.outputs.tag }}
          generate_release_notes: true
          files: |
            FFXIVSpanishPatcher-${{ needs.validate-tag.outputs.version }}-${{ matrix.rid }}.zip
            FFXIVSpanishPatcher-${{ needs.validate-tag.outputs.version }}-${{ matrix.rid }}.zip.sha256

      # Sube el zip de Linux y macOS como nueva versión del fichero existente en Nexus Mods
      # (Upload API v3, beta). Windows queda fuera.
      # Reutiliza exactamente el mismo ZIP ya adjuntado a GitHub, sin recompilar ni reempaquetar.
      # Requiere el secret NEXUSMODS_API_KEY (Site Preferences -> API Keys en nexusmods.com).
      - name: Prepare Nexus Mods description
        id: nexus-description
        if: matrix.rid != 'win-x64' && matrix.nexus_file_id != ''
        shell: bash
        run: >-
          ./.github/scripts/release/prepare-nexus-description.sh
          "${{ needs.validate-tag.outputs.version }}"
          "${{ matrix.rid }}"

      - name: Upload to Nexus Mods
        if: matrix.rid != 'win-x64' && matrix.nexus_file_id != ''
        uses: Nexus-Mods/upload-action@c96019556046053aa26044b44396cd38929daf23 # v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ matrix.nexus_file_id }}
          filename: FFXIVSpanishPatcher-${{ needs.validate-tag.outputs.version }}-${{ matrix.rid }}.zip
          version: ${{ needs.validate-tag.outputs.version }}
          display_name: FFXIVSpanishPatcher ${{ needs.validate-tag.outputs.version }} (${{ matrix.rid }})
          description: ${{ steps.nexus-description.outputs.description }}
          archive_existing_version: true

  sign-windows:
    needs: [validate-tag, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download native Windows publish
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-windows-publish
          path: publish/win-x64

      # Self-signed Authenticode: preserves a verifiable publisher identity without placing its
      # private key in the repository. Windows will not treat this as a publicly trusted CA
      # signature, so SHA-256 checksums below remain the release-verification mechanism.
      - name: Self-sign and verify Windows executable on Linux
        timeout-minutes: 5
        env:
          WINDOWS_SELF_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SELF_SIGNING_PFX_BASE64 }}
          WINDOWS_SELF_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SELF_SIGNING_PFX_PASSWORD }}
        run: ./.github/scripts/release/self-sign-windows.sh

      - name: Package Windows
        run: ./.github/scripts/release/package-windows.sh "${{ needs.validate-tag.outputs.version }}"

      - name: Attach Windows to release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: ${{ needs.validate-tag.outputs.tag }}
          generate_release_notes: true
          files: |
            FFXIVSpanishPatcher-${{ needs.validate-tag.outputs.version }}-win-x64.zip
            FFXIVSpanishPatcher-${{ needs.validate-tag.outputs.version }}-win-x64.zip.sha256

      # Windows is deliberately not uploaded to Nexus Mods; see the matrix note above.

  # The Dalamud plugin is plain IL: one build serves every platform. It comes from the same tag
  # and carries the same version as the patcher.
  plugin:
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Download Dalamud reference assemblies
        run: ./.github/scripts/ci/setup-dalamud.sh

      - name: Build, test and package plugin
        run: >-
          ./.github/scripts/release/package-plugin.sh
          "${{ needs.validate-tag.outputs.version }}"
          "${{ needs.validate-tag.outputs.tag }}"

      - name: Attach plugin to release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: ${{ needs.validate-tag.outputs.tag }}
          generate_release_notes: true
          files: |
            FFXIVSpanishTranslationManager-${{ needs.validate-tag.outputs.version }}.zip
            FFXIVSpanishTranslationManager-${{ needs.validate-tag.outputs.version }}.zip.sha256

      - name: Describe this release for the Dalamud repository
        run: >-
          ./.github/scripts/release/write-pluginmaster.sh
          "${{ needs.validate-tag.outputs.version }}"
          "${{ needs.validate-tag.outputs.tag }}"
          "${{ github.repository }}"
          pluginmaster.json

      - name: Hand the repository file to the publishing job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pluginmaster
          path: pluginmaster.json
          if-no-files-found: error
          retention-days: 1

  # Last on purpose: Dalamud users are offered the new plugin only after the whole release, the
  # patcher included, is attached. The file is built from the tag but committed to the default
  # branch, which is where the repository URL given to users reads it from.
  pluginmaster:
    needs: [validate-tag, publish, sign-windows, plugin]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download the repository file
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pluginmaster
          path: ${{ runner.temp }}/pluginmaster

      - name: Publish to the Dalamud repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./.github/scripts/release/publish-pluginmaster.sh
          "${{ needs.validate-tag.outputs.version }}"
          "${{ needs.validate-tag.outputs.tag }}"
          "${{ runner.temp }}/pluginmaster/pluginmaster.json"
          "${{ github.event.repository.default_branch }}"
