name: Release

# Tag a commit (e.g. v1.2.3) to build self-contained publishes for Windows, Linux and macOS and
# attach them to a GitHub Release. Windows keeps only the translation corpus external so it does
# not place that high-entropy Brotli blob inside the executable. Windows publishes natively on a
# Windows runner, Linux on Ubuntu, and the macOS RID (Apple Silicon only) on macOS so the .app
# bundle can be ad-hoc codesigned.
on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: write

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate tag and derive version
        id: version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$ ]]; then
            echo "::error::Release tags must match vX.Y.Z, with each number from 0 to 999."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  publish:
    needs: validate-tag
    # Each RID publishes on its native operating system. The macOS bundle remains ad-hoc signed
    # (mandatory for arm64 to run at all, and removes the "damaged" Gatekeeper error).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # nexus_file_id: "API Info" del fichero en la pestaña Files de nexusmods.com (mod 2513).
          - { rid: win-x64,   os: windows-latest, nexus_file_id: 7608014, external_translations: "true" }
          - { rid: linux-x64, os: ubuntu-latest, nexus_file_id: 7651772, external_translations: "false" }
          # macos-latest pinned to macos-15: the "latest" label migrates to macOS 26 (beta) from
          # 2026-06-15, before it is a stable target for the ad-hoc codesign/publish steps below.
          - { rid: osx-arm64, os: macos-15,  nexus_file_id: 7608017, external_translations: "false" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Publish ${{ matrix.rid }}
        shell: bash
        run: >
          dotnet restore src/FFXIVSpanishPatcher.App/FFXIVSpanishPatcher.App.csproj
          --locked-mode
          &&
          dotnet publish src/FFXIVSpanishPatcher.App/FFXIVSpanishPatcher.App.csproj
          -c Release -r ${{ matrix.rid }} --self-contained --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:ExternalTranslations=${{ matrix.external_translations }}
          -p:Version=${{ needs.validate-tag.outputs.version }}
          -p:InformationalVersion=${{ needs.validate-tag.outputs.tag }}
          -p:AssemblyVersion=${{ needs.validate-tag.outputs.version }}.0
          -p:FileVersion=${{ needs.validate-tag.outputs.version }}.0
          -p:RepositorySlug=${{ github.repository }}
          -p:LatestReleaseApiUrl=https://api.github.com/repos/${{ github.repository }}/releases/latest
          -p:LatestReleasePageUrl=https://github.com/${{ github.repository }}/releases/latest
          -o publish/${{ matrix.rid }}

      # Self-signed Authenticode: preserves a verifiable publisher identity without placing its
      # private key in the repository. Windows will not treat this as a publicly trusted CA
      # signature, so SHA-256 checksums below remain the release-verification mechanism.
      - name: Self-sign Windows executable
        if: matrix.rid == 'win-x64'
        shell: pwsh
        env:
          WINDOWS_SELF_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SELF_SIGNING_PFX_BASE64 }}
          WINDOWS_SELF_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SELF_SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if (
            [string]::IsNullOrWhiteSpace($env:WINDOWS_SELF_SIGNING_PFX_BASE64) -or
            [string]::IsNullOrWhiteSpace($env:WINDOWS_SELF_SIGNING_PFX_PASSWORD)
          ) {
            Write-Warning "Windows self-signing skipped: configure WINDOWS_SELF_SIGNING_PFX_BASE64 and WINDOWS_SELF_SIGNING_PFX_PASSWORD."
            exit 0
          }

          $certificateDirectory = Join-Path $env:RUNNER_TEMP "ffxivspanish-signing-$([guid]::NewGuid())"
          New-Item -ItemType Directory -Path $certificateDirectory | Out-Null

          try {
            $pfx = Join-Path $certificateDirectory "FFXIVSpanishPatcher-self-signed.pfx"
            $exe = "publish/win-x64/FFXIVSpanishPatcher.exe"
            [IO.File]::WriteAllBytes(
              $pfx,
              [Convert]::FromBase64String($env:WINDOWS_SELF_SIGNING_PFX_BASE64)
            )

            $flags = [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
            $pfxCertificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
              $pfx,
              $env:WINDOWS_SELF_SIGNING_PFX_PASSWORD,
              $flags
            )
            $documentedCertificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::CreateFromPemFile(
              (Resolve-Path "docs/security/FFXIVSpanishPatcher-self-signed.pem").Path
            )

            $expectedFingerprint = $documentedCertificate.GetCertHashString(
              [System.Security.Cryptography.HashAlgorithmName]::SHA256
            )
            $actualFingerprint = $pfxCertificate.GetCertHashString(
              [System.Security.Cryptography.HashAlgorithmName]::SHA256
            )
            if ($actualFingerprint -ne $expectedFingerprint) {
              throw "Windows signing certificate does not match documented public certificate."
            }

            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
              -Filter signtool.exe -Recurse |
              Where-Object FullName -Match '\\x64\\signtool\.exe$' |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if ($null -eq $signTool) {
              throw "signtool.exe was not found on windows-latest."
            }

            & $signTool.FullName sign `
              /f $pfx `
              /p $env:WINDOWS_SELF_SIGNING_PFX_PASSWORD `
              /fd SHA256 `
              /d "FFXIVSpanish Patcher" `
              /du "https://ffxivspanish.carrd.co/" `
              $exe
            if ($LASTEXITCODE -ne 0) {
              throw "signtool.exe failed to sign the Windows executable."
            }

            # Trust only on this ephemeral runner while verifying the self-signed chain.
            $rootStore = [System.Security.Cryptography.X509Certificates.X509Store]::new(
              [System.Security.Cryptography.X509Certificates.StoreName]::Root,
              [System.Security.Cryptography.X509Certificates.StoreLocation]::CurrentUser
            )
            $rootStore.Open(
              [System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite
            )
            try {
              $rootStore.Add($documentedCertificate)
              & $signTool.FullName verify /pa /v $exe
              if ($LASTEXITCODE -ne 0) {
                throw "signtool.exe could not verify the signed Windows executable."
              }
            }
            finally {
              $rootStore.Remove($documentedCertificate)
              $rootStore.Close()
            }
          }
          finally {
            if ($null -ne $pfxCertificate) {
              $pfxCertificate.Dispose()
            }
            if ($null -ne $documentedCertificate) {
              $documentedCertificate.Dispose()
            }
            if (Test-Path $certificateDirectory) {
              Remove-Item -Recurse -Force $certificateDirectory
            }
          }

      - name: Package Windows
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ needs.validate-tag.outputs.version }}"
          $out = "publish/win-x64"
          $asset = "FFXIVSpanishPatcher-$version-win-x64.zip"

          Get-ChildItem $out -Filter "*.pdb" -File | Remove-Item -Force
          Copy-Item README.md "$out/README.md"
          Compress-Archive -Path "$out/*" -DestinationPath $asset -CompressionLevel Optimal

          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content "$asset.sha256" -Encoding ascii

      - name: Package Linux or macOS
        if: matrix.rid != 'win-x64'
        run: |
          set -euo pipefail
          VERSION="${{ needs.validate-tag.outputs.version }}"
          RID="${{ matrix.rid }}"
          OUT="publish/$RID"
          ASSET="FFXIVSpanishPatcher-$VERSION-$RID.zip"
          rm -f "$OUT"/*.pdb
          if [[ "$RID" == osx-* ]]; then
            # Assemble a proper .app bundle so macOS shows the icon (Dock/Finder) and a real app name.
            APP="FFXIVSpanishPatcher.app"
            rm -rf "$APP"
            mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
            cp "$OUT/FFXIVSpanishPatcher" "$APP/Contents/MacOS/FFXIVSpanishPatcher"
            chmod +x "$APP/Contents/MacOS/FFXIVSpanishPatcher"
            cp src/FFXIVSpanishPatcher.App/Assets/icon.icns "$APP/Contents/Resources/icon.icns"
            sed "s/__VERSION__/$VERSION/g" build/macos/Info.plist > "$APP/Contents/Info.plist"
            # Ad-hoc sign (inner Mach-O, then the bundle). Required for arm64 to launch and removes
            # the "is damaged" Gatekeeper error. Not notarized: users still "Open Anyway" once.
            codesign --force --timestamp=none --sign - "$APP/Contents/MacOS/FFXIVSpanishPatcher"
            codesign --force --timestamp=none --sign - "$APP"
            codesign --verify --strict --verbose=2 "$APP"
            # ditto is Apple's archiver; it preserves the code signature and bundle layout.
            ditto -c -k --keepParent "$APP" "$ASSET"
          else
            cp README.md "$OUT/README.md"
            ( cd "$OUT" && zip -r "../../$ASSET" . )
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum "$ASSET" > "$ASSET.sha256"
          else
            shasum -a 256 "$ASSET" > "$ASSET.sha256"
          fi

      - name: Attach to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: ${{ needs.validate-tag.outputs.tag }}
          generate_release_notes: true
          files: |
            FFXIVSpanishPatcher-${{ needs.validate-tag.outputs.version }}-${{ matrix.rid }}.zip
            FFXIVSpanishPatcher-${{ needs.validate-tag.outputs.version }}-${{ matrix.rid }}.zip.sha256

      # Sube el zip como nueva versión del fichero existente en Nexus Mods (Upload API v3, beta).
      # Reutiliza exactamente el mismo ZIP ya adjuntado a GitHub, sin recompilar ni reempaquetar.
      # Requiere el secret NEXUSMODS_API_KEY (Site Preferences -> API Keys en nexusmods.com).
      - name: Prepare Nexus Mods description
        id: nexus-description
        if: matrix.nexus_file_id != ''
        shell: bash
        run: |
          VERSION="${{ needs.validate-tag.outputs.version }}"
          RID="${{ matrix.rid }}"

          case "$RID" in
            win-x64)
              DESCRIPTION="Versión $VERSION para Windows 11. Si la descarga aún no está disponible en Nexus (validación manual pendiente), puedes bajarla ya desde GitHub: https://github.com/${{ github.repository }}/releases/latest"
              ;;
            linux-x64)
              DESCRIPTION="Versión $VERSION para Linux (x64)"
              ;;
            osx-arm64)
              DESCRIPTION="Versión $VERSION para macOS Apple Silicon"
              ;;
            *)
              echo "::error::RID no soportado: $RID"
              exit 1
              ;;
          esac

          echo "description=$DESCRIPTION" >> "$GITHUB_OUTPUT"

      - name: Upload to Nexus Mods
        if: matrix.nexus_file_id != ''
        uses: Nexus-Mods/upload-action@c96019556046053aa26044b44396cd38929daf23 # v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ matrix.nexus_file_id }}
          filename: FFXIVSpanishPatcher-${{ needs.validate-tag.outputs.version }}-${{ matrix.rid }}.zip
          version: ${{ needs.validate-tag.outputs.version }}
          display_name: FFXIVSpanishPatcher ${{ needs.validate-tag.outputs.version }} (${{ matrix.rid }})
          description: ${{ steps.nexus-description.outputs.description }}
          archive_existing_version: true
