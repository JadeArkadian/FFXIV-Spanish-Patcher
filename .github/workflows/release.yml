name: Release

# Tag a commit (e.g. v1.2.3) to build self-contained publishes for Windows, Linux and macOS and
# attach them to a GitHub Release. Windows keeps only the translation corpus external so it does
# not place that high-entropy Brotli blob inside the executable. Windows publishes natively on a
# Windows runner, then Windows signing runs non-interactively on Ubuntu. Linux publishes on Ubuntu,
# and the macOS RID (Apple Silicon only) publishes on macOS so the .app can be ad-hoc codesigned.
on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: write

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate tag and derive version
        id: version
        run: ./.github/scripts/release/validate-tag.sh

  publish:
    needs: validate-tag
    # Each RID publishes on its native operating system. The macOS bundle remains ad-hoc signed
    # (mandatory for arm64 to run at all, and removes the "damaged" Gatekeeper error).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # nexus_file_id: "API Info" del fichero en la pestaña Files de nexusmods.com (mod 2513).
          - { rid: win-x64,   os: windows-latest, nexus_file_id: 7608014, external_translations: "false" }
          - { rid: linux-x64, os: ubuntu-latest, nexus_file_id: 7651772, external_translations: "false" }
          # macos-latest pinned to macos-15: the "latest" label migrates to macOS 26 (beta) from
          # 2026-06-15, before it is a stable target for the ad-hoc codesign/publish steps below.
          - { rid: osx-arm64, os: macos-15,  nexus_file_id: 7608017, external_translations: "false" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Publish ${{ matrix.rid }}
        shell: bash
        run: >-
          ./.github/scripts/release/publish-native.sh
          "${{ matrix.rid }}"
          "${{ matrix.external_translations }}"
          "${{ needs.validate-tag.outputs.version }}"
          "${{ needs.validate-tag.outputs.tag }}"
          "${{ github.repository }}"

      # Keep the Windows publish native, then pass it to a Linux job for non-interactive signing.
      - name: Upload unsigned Windows publish
        if: matrix.rid == 'win-x64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-windows-publish
          path: publish/win-x64/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Package Linux or macOS
        if: matrix.rid != 'win-x64'
        run: >-
          ./.github/scripts/release/package-unix.sh
          "${{ needs.validate-tag.outputs.version }}"
          "${{ matrix.rid }}"

      - name: Attach to release
        if: matrix.rid != 'win-x64'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: ${{ needs.validate-tag.outputs.tag }}
          generate_release_notes: true
          files: |
            FFXIVSpanishPatcher-${{ needs.validate-tag.outputs.version }}-${{ matrix.rid }}.zip
            FFXIVSpanishPatcher-${{ needs.validate-tag.outputs.version }}-${{ matrix.rid }}.zip.sha256

      # Sube el zip como nueva versión del fichero existente en Nexus Mods (Upload API v3, beta).
      # Reutiliza exactamente el mismo ZIP ya adjuntado a GitHub, sin recompilar ni reempaquetar.
      # Requiere el secret NEXUSMODS_API_KEY (Site Preferences -> API Keys en nexusmods.com).
      - name: Prepare Nexus Mods description
        id: nexus-description
        if: matrix.rid != 'win-x64' && matrix.nexus_file_id != ''
        shell: bash
        run: >-
          ./.github/scripts/release/prepare-nexus-description.sh
          "${{ needs.validate-tag.outputs.version }}"
          "${{ matrix.rid }}"
          "${{ github.repository }}"

      - name: Upload to Nexus Mods
        if: matrix.rid != 'win-x64' && matrix.nexus_file_id != ''
        uses: Nexus-Mods/upload-action@c96019556046053aa26044b44396cd38929daf23 # v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ matrix.nexus_file_id }}
          filename: FFXIVSpanishPatcher-${{ needs.validate-tag.outputs.version }}-${{ matrix.rid }}.zip
          version: ${{ needs.validate-tag.outputs.version }}
          display_name: FFXIVSpanishPatcher ${{ needs.validate-tag.outputs.version }} (${{ matrix.rid }})
          description: ${{ steps.nexus-description.outputs.description }}
          archive_existing_version: true

  sign-windows:
    needs: [validate-tag, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download native Windows publish
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-windows-publish
          path: publish/win-x64

      # Self-signed Authenticode: preserves a verifiable publisher identity without placing its
      # private key in the repository. Windows will not treat this as a publicly trusted CA
      # signature, so SHA-256 checksums below remain the release-verification mechanism.
      - name: Self-sign and verify Windows executable on Linux
        timeout-minutes: 5
        env:
          WINDOWS_SELF_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SELF_SIGNING_PFX_BASE64 }}
          WINDOWS_SELF_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SELF_SIGNING_PFX_PASSWORD }}
        run: ./.github/scripts/release/self-sign-windows.sh

      - name: Package Windows
        run: ./.github/scripts/release/package-windows.sh "${{ needs.validate-tag.outputs.version }}"

      - name: Attach Windows to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: ${{ needs.validate-tag.outputs.tag }}
          generate_release_notes: true
          files: |
            FFXIVSpanishPatcher-${{ needs.validate-tag.outputs.version }}-win-x64.zip
            FFXIVSpanishPatcher-${{ needs.validate-tag.outputs.version }}-win-x64.zip.sha256

      - name: Upload Windows to Nexus Mods
        uses: Nexus-Mods/upload-action@c96019556046053aa26044b44396cd38929daf23 # v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: 7608014
          filename: FFXIVSpanishPatcher-${{ needs.validate-tag.outputs.version }}-win-x64.zip
          version: ${{ needs.validate-tag.outputs.version }}
          display_name: FFXIVSpanishPatcher ${{ needs.validate-tag.outputs.version }} (win-x64)
          description: >-
            Versión ${{ needs.validate-tag.outputs.version }} para Windows 11. Si la descarga aún no
            está disponible en Nexus (validación manual pendiente), puedes bajarla ya desde GitHub:
            https://github.com/${{ github.repository }}/releases/latest
          archive_existing_version: true
