name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # The plugin projects compile against Dalamud's own assemblies; see the script for why the
      # release track floats.
      - name: Download Dalamud reference assemblies
        run: ./.github/scripts/ci/setup-dalamud.sh

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore -c Release

      # Includes the Avalonia headless GUI smoke test, which needs no display.
      # data/translations.dat is versioned, so no corpus sync is needed in CI.
      - name: Test
        run: dotnet test --no-build -c Release --verbosity minimal

      # Runs the same packaging scripts as a release, so they cannot rot until tag day. The
      # repository file is only generated and validated here; nothing is published.
      - name: Package Dalamud plugin
        run: |
          ./.github/scripts/release/package-plugin.sh 0.0.0 dev
          ./.github/scripts/release/write-pluginmaster.sh 0.0.0 v0.0.0 "${{ github.repository }}" "$RUNNER_TEMP/pluginmaster.json"

      - name: Upload Dalamud plugin package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dalamud-plugin
          path: FFXIVSpanishTranslationManager-0.0.0.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # Native smoke for binaries users download. Cross-publish proves only that the executable was
  # produced; these runners prove it stays alive on its target OS before merge or release.
  native-publish-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64, external_translations: "false" }
          - { os: windows-latest, rid: win-x64, external_translations: "true" }
          - { os: macos-15, rid: osx-arm64, external_translations: "false" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Publish ${{ matrix.rid }}
        shell: bash
        run: ./.github/scripts/ci/publish-native.sh "${{ matrix.rid }}" "${{ matrix.external_translations }}"

      - name: Smoke Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/ci/smoke-windows.ps1

      - name: Smoke macOS executable
        if: runner.os == 'macOS'
        shell: bash
        run: ./.github/scripts/ci/smoke-unix.sh osx-arm64

      - name: Smoke Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: ./.github/scripts/ci/smoke-unix.sh linux-x64

      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-smoke-${{ matrix.rid }}
          path: ${{ runner.temp }}/FFXIVSpanishPatcher-smoke-*.log
          if-no-files-found: ignore
