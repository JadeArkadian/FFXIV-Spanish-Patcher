name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore -c Release

      # Includes the Avalonia headless GUI smoke test, which needs no display.
      # data/translations.dat is versioned, so no corpus sync is needed in CI.
      - name: Test
        run: dotnet test --no-build -c Release --verbosity minimal

  # Native smoke for binaries users download. Cross-publish proves only that the executable was
  # produced; these runners prove it stays alive on its target OS before merge or release.
  native-publish-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64, external_translations: "false" }
          - { os: windows-latest, rid: win-x64, external_translations: "true" }
          - { os: macos-15, rid: osx-arm64, external_translations: "false" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Publish ${{ matrix.rid }}
        shell: bash
        run: ./.github/scripts/ci/publish-native.sh "${{ matrix.rid }}" "${{ matrix.external_translations }}"

      - name: Smoke Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/ci/smoke-windows.ps1

      - name: Smoke macOS executable
        if: runner.os == 'macOS'
        shell: bash
        run: ./.github/scripts/ci/smoke-unix.sh osx-arm64

      - name: Smoke Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: ./.github/scripts/ci/smoke-unix.sh linux-x64

      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-smoke-${{ matrix.rid }}
          path: ${{ runner.temp }}/FFXIVSpanishPatcher-smoke-*.log
          if-no-files-found: ignore
